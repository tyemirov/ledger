services:
  ledger:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ledger-local:latest
    env_file:
      - ./configs/.env.ledger
    command: ["/srv/ledgerd", "--config", "/srv/config.yml"]
    volumes:
      - ledger_data:/srv/data
      - ./configs/config.yml:/srv/config.yml:ro
    expose:
      - "50051"
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  tauth:
    image: ghcr.io/tyemirov/tauth:latest
    pull_policy: always
    env_file:
      - ./configs/.env.tauth
    volumes:
      - tauth_data:/data
      - ./configs/tauth.config.yaml:/config.yaml:ro
    expose:
      - "8080"

  frontend-localhost:
    profiles: [localhost]
    image: ghcr.io/tyemirov/ghttp:latest
    pull_policy: always
    depends_on:
      ledger:
        condition: service_healthy
      tauth:
        condition: service_started
    environment:
      GHTTP_SERVE_PORT: "8000"
      GHTTP_SERVE_DIRECTORY: "/tmp"
      GHTTP_SERVE_PROXIES: "/auth=http://tauth:8080,/me=http://tauth:8080,/=http://ledger:8080"
      GHTTP_SERVE_RESPONSE_HEADERS: "/=Cache-Control:no-store"
    ports:
      - "127.0.0.1:8000:8000"

  frontend-computercat:
    profiles: [computercat]
    image: ghcr.io/tyemirov/ghttp:latest
    pull_policy: always
    depends_on:
      ledger:
        condition: service_healthy
      tauth:
        condition: service_started
    environment:
      GHTTP_SERVE_PORT: "4443"
      GHTTP_SERVE_DIRECTORY: "/tmp"
      GHTTP_SERVE_TLS_CERT_FILE: "/certs/computercat-cert.pem"
      GHTTP_SERVE_TLS_KEY_FILE: "/certs/computercat-key.pem"
      GHTTP_SERVE_PROXIES: "/auth=http://tauth:8080,/me=http://tauth:8080,/=http://ledger:8080"
      GHTTP_SERVE_RESPONSE_HEADERS: "/=Cache-Control:no-store"
    ports:
      - "4443:4443"
    volumes:
      - "${DEMO_TLS_CERT_FILE:-/media/share/Drive/exchange/certs/computercat/computercat-cert.pem}:/certs/computercat-cert.pem:ro"
      - "${DEMO_TLS_KEY_FILE:-/media/share/Drive/exchange/certs/computercat/computercat-key.pem}:/certs/computercat-key.pem:ro"

volumes:
  ledger_data:
  tauth_data:
