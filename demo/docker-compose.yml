name: ledger-local

services:
  ledger:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ledger-local:latest
    env_file:
      - ${LEDGER_LOCAL_LEDGER_ENV_FILE:?LEDGER_LOCAL_LEDGER_ENV_FILE is required}
    command: ["/srv/ledgerd", "--config", "/srv/config.yml"]
    volumes:
      - ledger_data:/srv/data
      - ./configs/config.yml:/srv/config.yml:ro
    expose:
      - "50051"
      - "8080"
    ports:
      - "127.0.0.1:50051:50051"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  tauth:
    image: ghcr.io/tyemirov/tauth:latest
    pull_policy: always
    env_file:
      - ${LEDGER_LOCAL_TAUTH_ENV_FILE:?LEDGER_LOCAL_TAUTH_ENV_FILE is required}
    volumes:
      - tauth_data:/data
      - ./configs/tauth.config.yaml:/config.yaml:ro
    expose:
      - "8080"

  frontend:
    image: ghcr.io/tyemirov/ghttp:latest
    pull_policy: always
    depends_on:
      ledger:
        condition: service_healthy
      tauth:
        condition: service_started
    environment:
      GHTTP_SERVE_PORT: "8000"
      GHTTP_SERVE_DIRECTORY: "/tmp"
      GHTTP_SERVE_PROXIES: "/auth=http://tauth:8080,/me=http://tauth:8080,/=http://ledger:8080"
      GHTTP_SERVE_RESPONSE_HEADERS: "/=Cache-Control:no-store"
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  ledger_data:
  tauth_data:
