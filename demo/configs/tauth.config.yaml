server:
  listen_addr: ":8080"
  enable_cors: true
  cors_allowed_origins:
    - "${TAUTH_PUBLIC_ORIGIN}"
  database_url: "${TAUTH_DATABASE_URL}"
  enable_tenant_header_override: true

tenants:
  - id: "${TAUTH_TENANT_ID}"
    allow_insecure_http: true
    cookie_domain: ""
    google_web_client_id: "${TAUTH_GOOGLE_CLIENT_ID}"
    jwt_signing_key: "${TAUTH_JWT_SIGNING_KEY}"
    session_cookie_name: "${TAUTH_SESSION_COOKIE_NAME}"
    refresh_cookie_name: "${TAUTH_REFRESH_COOKIE_NAME}"
    session_ttl: "24h"
    refresh_ttl: "720h"
    nonce_ttl: "5m"
    tenant_origins:
      - "${TAUTH_PUBLIC_ORIGIN}"
