---
mprlab_resources:
  schema_version: 2
  owner: ledger
  dependencies: []
  resources:
    - kind: compose_project
      id: runtime
      placement: gateway
      profiles: []
      images:
        - id: ledger-image
          repository: ghcr.io/tyemirov/ledger
          visibility: public
          build:
            context: .
            dockerfile: Dockerfile
            platforms:
              - linux/amd64
              - linux/arm64
      services:
        - id: ledger-api
          image: ledger-image
          environment:
            DATABASE_URL:
              secret: ledger.database-url
            HECATE_TENANT_SECRET:
              secret: ledger.hecate-tenant-secret
            NAMESIGNAL_TENANT_SECRET:
              secret: ledger.namesignal-tenant-secret
            POODLESCANNER_TENANT_SECRET:
              secret: ledger.poodlescanner-tenant-secret
          assets:
            - source: configs/config.ledger.yml
              target: /srv/config.yml
              mode: "0444"
          mounts:
            - volume: data
              target: /srv/data
              read_only: false
          ports:
            - container_port: 50051
      volumes:
        - id: data
          name: ledger-data
          retention: retain
    - kind: runtime_capability
      id: grpc
      name: ledger.grpc
      version: 1
      project: runtime
      service: ledger-api
      endpoint:
        scope: same_host
        scheme: grpc
        alias: ledger-api
        port: 50051
      health:
        protocol: tcp
