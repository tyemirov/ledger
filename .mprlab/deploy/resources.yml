mprlab_resources:
    artifacts:
        container_images:
            - build:
                context: .
                dockerfile: Dockerfile
                platforms:
                    - linux/amd64
                    - linux/arm64
              id: ledger-image
        web_bundles:
            - format: directory
              id: frontend
              source:
                context: .
                dockerfile: Dockerfile
                kind: container
                target: pages
    environment:
        private_inputs:
            - id: database-url
              variable: DATABASE_URL
            - id: deploy-sudo-password-tutosh
              variable: DEPLOY_SUDO_PASSWORD_TUTOSH
            - id: mprlab-tauth-management-url
              variable: MPRLAB_TAUTH_MANAGEMENT_URL
            - id: mprlab-tauth-provisioning-credentials
              variable: MPRLAB_TAUTH_PROVISIONING_CREDENTIALS
            - id: tauth-google-client-id
              variable: TAUTH_GOOGLE_CLIENT_ID
            - id: tauth-jwt-signing-key
              variable: TAUTH_JWT_SIGNING_KEY
        source: .mprlab/deploy/.env
    lifecycle:
        ci:
            command:
                - make
                - ci
            enabled: true
        defaults:
            timeouts:
                completion: 30m
                readiness: 30s
                request: 15s
                shutdown: 5s
                startup: 30s
        observations:
            http:
                - expected_status: 200
                  id: api-health
                  protocol: http
                  url: https://ledger-api.mprlab.com/healthz
        operations:
            - name: app-deploy
              polling:
                attempt_limit: 360
                increment: 0s
                initial: 1s
                maximum: 5s
                multiplier: 2
            - name: app-publish
              polling:
                attempt_limit: 360
                increment: 0s
                initial: 1s
                maximum: 5s
                multiplier: 2
            - name: app-release
              polling:
                attempt_limit: 360
                increment: 0s
                initial: 1s
                maximum: 5s
                multiplier: 2
            - name: app_lifecycle.repository_read
              polling:
                attempt_limit: 360
                increment: 0s
                initial: 1s
                maximum: 5s
                multiplier: 2
        private_inputs:
            operations: []
    owner: ledger
    publications:
        ghcr:
            images:
                - artifact: ledger-image
                  id: ledger-image
                  repository: ghcr.io/tyemirov/ledger
        github_pages:
            sites:
                - artifact: frontend
                  branch: gh-pages
                  domain: ledger.mprlab.com
                  id: frontend
                  marker:
                    path: /.mprlab-release.json
                  repository: tyemirov/ledger
    release:
        scheme: semver
    targets:
        access:
            hosts:
                - elevation_password:
                    input: deploy-sudo-password-tutosh
                  host: tutosh
        docker_compose:
            projects:
                - id: runtime
                  retired_services:
                    - project: mprlab-nginx-gateway
                      service: ledger-api
                  services:
                    - assets:
                        - mode: "0444"
                          source: configs/config.ledger.yml
                          target: /srv/config.yml
                      endpoints:
                        - endpoint:
                            alias: ledger-api
                            port: 50051
                            scheme: grpc
                            scope: same_host
                          health:
                            protocol: tcp
                          id: grpc
                          name: ledger.grpc
                          version: 1
                        - endpoint:
                            port: 50051
                            scheme: grpc
                            scope: private_lan
                          health:
                            protocol: tcp
                          id: grpc-private-lan
                          name: ledger.grpc.private-lan
                          version: 1
                        - endpoint:
                            alias: ledger-http
                            port: 8080
                            scheme: http
                            scope: same_host
                          health:
                            expected_status: 200
                            path: /healthz
                            protocol: http
                          id: http
                          name: ledger.http
                          version: 1
                        - endpoint:
                            port: 18082
                            scheme: http
                            scope: private_lan
                          health:
                            expected_status: 200
                            path: /healthz
                            protocol: http
                          id: http-private-lan
                          name: ledger.http.private-lan
                          version: 1
                        - endpoint:
                            alias: runtime-ledger-api-readiness
                            port: 8080
                            scheme: http
                            scope: same_host
                          health:
                            expected_status: 200
                            path: /healthz
                            protocol: http
                          id: readiness
                          name: ledger.readiness.runtime.ledger-api
                          version: 1
                      environment:
                        - input: database-url
                          name: DATABASE_URL
                        - name: LEDGER_PUBLIC_ORIGIN
                          value: https://ledger.mprlab.com
                        - input: tauth-google-client-id
                          name: TAUTH_GOOGLE_CLIENT_ID
                        - input: tauth-jwt-signing-key
                          name: TAUTH_JWT_SIGNING_KEY
                        - name: TAUTH_SESSION_COOKIE_NAME
                          value: ledger_session
                        - name: TAUTH_TENANT_ID
                          value: ledger
                        - name: TAUTH_URL
                          value: https://ledger-api.mprlab.com
                      id: ledger-api
                      image:
                        publication: ledger-image
                      mounts:
                        - read_only: false
                          target: /srv/data
                          volume: data
                      placement:
                        cardinality: one
                        group: gateway
                      ports:
                        - container_port: 50051
                          host_port: 50051
                          scope: private_lan
                        - container_port: 8080
                          host_port: 18082
                          scope: private_lan
                      readiness:
                        endpoint: readiness
                  volumes:
                    - id: data
                      name: ledger-data
                      retention: retain
        github_pages:
            sites:
                - id: frontend
                  publication: frontend
                  url: https://ledger.mprlab.com/
        ingress:
            caddy:
                routes:
                    - handlers:
                        - id: authentication
                          path_prefix: /auth
                          upstream: tauth.http
                        - id: browser-config
                          path_prefix: /config-ui.yaml
                          upstream: ledger.http
                        - id: control-plane
                          path_prefix: /api
                          upstream: ledger.http
                        - id: health
                          path_prefix: /healthz
                          upstream: ledger.http
                        - id: profile
                          path_prefix: /me
                          upstream: tauth.http
                      hostname: ledger-api.mprlab.com
                      id: api
                      listener: https
                      tls:
                        mode: automatic
