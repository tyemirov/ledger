---
mprlab_resources:
  owner: ledger
  release:
    scheme: semver
  resources:
    - kind: private_values
      id: private
      bindings:
        database-url: DATABASE_URL
        hecate-tenant-secret: HECATE_TENANT_SECRET
        namesignal-tenant-secret: NAMESIGNAL_TENANT_SECRET
        poodlescanner-tenant-secret: POODLESCANNER_TENANT_SECRET
    - kind: compose_project
      id: runtime
      retired_services:
        - project: mprlab-nginx-gateway
          service: ledger-api
      images:
        - id: ledger-image
          repository: ghcr.io/tyemirov/ledger
          build:
            context: .
            dockerfile: Dockerfile
            platforms:
              - linux/amd64
              - linux/arm64
      services:
        - id: ledger-api
          image: ledger-image
          placement:
            group: gateway
            cardinality: one
          environment:
            DATABASE_URL:
              resource: private
              output: database-url
            HECATE_TENANT_SECRET:
              resource: private
              output: hecate-tenant-secret
            NAMESIGNAL_TENANT_SECRET:
              resource: private
              output: namesignal-tenant-secret
            POODLESCANNER_TENANT_SECRET:
              resource: private
              output: poodlescanner-tenant-secret
          assets:
            - source: configs/config.ledger.yml
              target: /srv/config.yml
              mode: "0444"
          mounts:
            - volume: data
              target: /srv/data
              read_only: false
          ports:
            - container_port: 50051
      volumes:
        - id: data
          name: ledger-data
          retention: retain
    - kind: runtime_capability
      id: grpc
      name: ledger.grpc
      version: 1
      project: runtime
      service: ledger-api
      endpoint:
        scope: same_host
        scheme: grpc
        alias: ledger-api
        port: 50051
      health:
        protocol: tcp
