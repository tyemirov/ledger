---
mprlab_resources:
  owner: ledger
  release:
    scheme: semver
  resources:
    private:
      kind: private_values
      bindings:
        database-url: DATABASE_URL
        tauth-jwt-signing-key: TAUTH_JWT_SIGNING_KEY
        tauth-google-client-id: TAUTH_GOOGLE_CLIENT_ID
    runtime:
      kind: compose_project
      retired_services:
        mprlab-nginx-gateway/ledger-api: {}
      images:
        ledger-image:
          repository: ghcr.io/tyemirov/ledger
          build:
            context: .
            dockerfile: Dockerfile
            platforms:
            - linux/amd64
            - linux/arm64
      services:
        ledger-api:
          image: ledger-image
          placement:
            group: gateway
            cardinality: one
          environment:
            DATABASE_URL:
              resource: private
              output: database-url
            LEDGER_PUBLIC_ORIGIN:
              value: https://ledger.mprlab.com
            TAUTH_JWT_SIGNING_KEY:
              resource: authentication
              output: jwt-signing-key
            TAUTH_GOOGLE_CLIENT_ID:
              resource: authentication
              output: google-web-client-id
            TAUTH_SESSION_COOKIE_NAME:
              resource: authentication
              output: session-cookie-name
            TAUTH_TENANT_ID:
              resource: authentication
              output: tenant-id
            TAUTH_URL:
              value: https://ledger-api.mprlab.com
          assets:
            /srv/config.yml:
              source: configs/config.ledger.yml
              mode: '0444'
          mounts:
            /srv/data:
              volume: data
              read_only: false
          ports:
            '50051': {}
            '8080': {}
          readiness:
            protocol: http
            port: 8080
            path: /healthz
            expected_status: 200
      volumes:
        data:
          name: ledger-data
          retention: retain
    grpc:
      kind: runtime_capability
      name: ledger.grpc
      version: 1
      project: runtime
      service: ledger-api
      endpoint:
        scope: same_host
        scheme: grpc
        alias: ledger-api
        port: 50051
      health:
        protocol: tcp
    http:
      kind: runtime_capability
      name: ledger.http
      version: 1
      project: runtime
      service: ledger-api
      endpoint:
        scope: same_host
        scheme: http
        alias: ledger-http
        port: 8080
      health:
        protocol: http
        path: /healthz
        expected_status: 200
    authentication:
      kind: tauth_tenant
      capability: tauth.tenants
      version: 1
      tenant:
        id: ledger
        display_name: Ledger
        origins:
        - https://ledger.mprlab.com
        google_web_client_id:
          resource: private
          output: tauth-google-client-id
        jwt_signing_key:
          resource: private
          output: tauth-jwt-signing-key
        cookie:
          domain: ledger-api.mprlab.com
          session_name: ledger_session
          refresh_name: ledger_refresh
    api:
      kind: caddy_route
      hostname: ledger-api.mprlab.com
      listener: https
      handlers:
        authentication:
          path_prefix: /auth
          upstream: tauth.http
        profile:
          path_prefix: /me
          upstream: tauth.http
        control-plane:
          path_prefix: /api
          upstream: ledger.http
        browser-config:
          path_prefix: /config-ui.yaml
          upstream: ledger.http
        health:
          path_prefix: /healthz
          upstream: ledger.http
      tls:
        mode: automatic
    api-health:
      kind: health_check
      protocol: http
      url: https://ledger-api.mprlab.com/healthz
      expected_status: 200
    frontend:
      kind: github_pages
      repository: tyemirov/ledger
      branch: gh-pages
      domain: ledger.mprlab.com
      url: https://ledger.mprlab.com/
      source:
        kind: container
        context: .
        dockerfile: Dockerfile
        target: pages
      verification:
        path: /.mprlab-release.json
