---
mprlab_resources:
  owner: ledger
  release:
    scheme: semver
  resources:
    - kind: private_values
      id: private
      bindings:
        database-url: DATABASE_URL
        tauth-jwt-signing-key: TAUTH_JWT_SIGNING_KEY
        tauth-google-client-id: TAUTH_GOOGLE_CLIENT_ID
    - kind: compose_project
      id: runtime
      retired_services:
        - project: mprlab-nginx-gateway
          service: ledger-api
      images:
        - id: ledger-image
          repository: ghcr.io/tyemirov/ledger
          build:
            context: .
            dockerfile: Dockerfile
            platforms:
              - linux/amd64
              - linux/arm64
      services:
        - id: ledger-api
          image: ledger-image
          placement:
            group: gateway
            cardinality: one
          environment:
            DATABASE_URL:
              resource: private
              output: database-url
            LEDGER_PUBLIC_ORIGIN:
              value: https://ledger.mprlab.com
            TAUTH_JWT_SIGNING_KEY:
              resource: authentication
              output: jwt-signing-key
            TAUTH_GOOGLE_CLIENT_ID:
              resource: authentication
              output: google-web-client-id
            TAUTH_SESSION_COOKIE_NAME:
              resource: authentication
              output: session-cookie-name
            TAUTH_TENANT_ID:
              resource: authentication
              output: tenant-id
            TAUTH_URL:
              value: https://ledger-api.mprlab.com
          assets:
            - source: configs/config.ledger.yml
              target: /srv/config.yml
              mode: "0444"
          mounts:
            - volume: data
              target: /srv/data
              read_only: false
          ports:
            - container_port: 50051
            - container_port: 8080
          readiness:
            protocol: http
            port: 8080
            path: /healthz
            expected_status: 200
      volumes:
        - id: data
          name: ledger-data
          retention: retain
    - kind: runtime_capability
      id: grpc
      name: ledger.grpc
      version: 1
      project: runtime
      service: ledger-api
      endpoint:
        scope: same_host
        scheme: grpc
        alias: ledger-api
        port: 50051
      health:
        protocol: tcp
    - kind: runtime_capability
      id: http
      name: ledger.http
      version: 1
      project: runtime
      service: ledger-api
      endpoint:
        scope: same_host
        scheme: http
        alias: ledger-http
        port: 8080
      health:
        protocol: http
        path: /healthz
        expected_status: 200
    - kind: tauth_tenant
      id: authentication
      capability: tauth.tenants
      version: 1
      tenant:
        id: ledger
        display_name: Ledger
        origins:
          - https://ledger.mprlab.com
        google_web_client_id:
          resource: private
          output: tauth-google-client-id
        jwt_signing_key:
          resource: private
          output: tauth-jwt-signing-key
        cookie:
          domain: ledger-api.mprlab.com
          session_name: ledger_session
          refresh_name: ledger_refresh
    - kind: caddy_route
      id: api
      hostname: ledger-api.mprlab.com
      listener: https
      handlers:
        - id: authentication
          path_prefix: /auth
          upstream: tauth.http
        - id: profile
          path_prefix: /me
          upstream: tauth.http
        - id: control-plane
          path_prefix: /api
          upstream: ledger.http
        - id: browser-config
          path_prefix: /config-ui.yaml
          upstream: ledger.http
        - id: health
          path_prefix: /healthz
          upstream: ledger.http
      tls:
        mode: automatic
    - kind: health_check
      id: api-health
      protocol: http
      url: https://ledger-api.mprlab.com/healthz
      expected_status: 200
    - kind: github_pages
      id: frontend
      repository: tyemirov/ledger
      branch: gh-pages
      domain: ledger.mprlab.com
      url: https://ledger.mprlab.com/
      source:
        kind: container
        context: .
        dockerfile: Dockerfile
        target: pages
      verification:
        path: /.mprlab-release.json
