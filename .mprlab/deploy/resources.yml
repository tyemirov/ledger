---
mprlab_resources:
  owner: ledger
  release:
    scheme: semver
  resources:
    - kind: private_values
      id: private
      bindings:
        database-url: DATABASE_URL
        ledger-public-origin: LEDGER_PUBLIC_ORIGIN
        tauth-jwt-issuer: TAUTH_JWT_ISSUER
        tauth-jwt-signing-key: TAUTH_JWT_SIGNING_KEY
        tauth-google-client-id: TAUTH_GOOGLE_CLIENT_ID
        tauth-login-path: TAUTH_LOGIN_PATH
        tauth-logout-path: TAUTH_LOGOUT_PATH
        tauth-nonce-path: TAUTH_NONCE_PATH
        tauth-session-path: TAUTH_SESSION_PATH
        tauth-session-cookie-name: TAUTH_SESSION_COOKIE_NAME
        tauth-tenant-id: TAUTH_TENANT_ID
        tauth-url: TAUTH_URL
    - kind: compose_project
      id: runtime
      retired_services:
        - project: mprlab-nginx-gateway
          service: ledger-api
      images:
        - id: ledger-image
          repository: ghcr.io/tyemirov/ledger
          build:
            context: .
            dockerfile: Dockerfile
            platforms:
              - linux/amd64
              - linux/arm64
      services:
        - id: ledger-api
          image: ledger-image
          placement:
            group: gateway
            cardinality: one
          environment:
            DATABASE_URL:
              resource: private
              output: database-url
            LEDGER_PUBLIC_ORIGIN:
              resource: private
              output: ledger-public-origin
            TAUTH_JWT_ISSUER:
              resource: private
              output: tauth-jwt-issuer
            TAUTH_JWT_SIGNING_KEY:
              resource: private
              output: tauth-jwt-signing-key
            TAUTH_GOOGLE_CLIENT_ID:
              resource: private
              output: tauth-google-client-id
            TAUTH_LOGIN_PATH:
              resource: private
              output: tauth-login-path
            TAUTH_LOGOUT_PATH:
              resource: private
              output: tauth-logout-path
            TAUTH_NONCE_PATH:
              resource: private
              output: tauth-nonce-path
            TAUTH_SESSION_PATH:
              resource: private
              output: tauth-session-path
            TAUTH_SESSION_COOKIE_NAME:
              resource: private
              output: tauth-session-cookie-name
            TAUTH_TENANT_ID:
              resource: private
              output: tauth-tenant-id
            TAUTH_URL:
              resource: private
              output: tauth-url
          assets:
            - source: configs/config.ledger.yml
              target: /srv/config.yml
              mode: "0444"
          mounts:
            - volume: data
              target: /srv/data
              read_only: false
          ports:
            - container_port: 50051
            - container_port: 8080
          readiness:
            protocol: http
            port: 8080
            path: /healthz
            expected_status: 200
      volumes:
        - id: data
          name: ledger-data
          retention: retain
    - kind: runtime_capability
      id: grpc
      name: ledger.grpc
      version: 1
      project: runtime
      service: ledger-api
      endpoint:
        scope: same_host
        scheme: grpc
        alias: ledger-api
        port: 50051
      health:
        protocol: tcp
    - kind: runtime_capability
      id: http
      name: ledger.http
      version: 1
      project: runtime
      service: ledger-api
      endpoint:
        scope: same_host
        scheme: http
        alias: ledger-api
        port: 8080
      health:
        protocol: http
        path: /healthz
        expected_status: 200
